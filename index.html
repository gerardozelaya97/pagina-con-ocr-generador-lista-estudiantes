<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de listas de estudiantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root { --ink: #001a70; --paper: #f4f6fa; --line: #cfd6e6; --accent: #001a70; --accent-soft: #e6ebf7; --warn: #9c4221; --ok: #007042; --mono: 'Comfortaa', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--mono); padding: 32px 24px 80px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { border-bottom: 3px solid var(--ink); padding-bottom: 16px; margin-bottom: 28px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 24px; margin: 0; font-weight: 700; }
  .tag { font-size: 11px; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: 4px 10px; border-radius: 6px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 860px) { .grid { grid-template-columns: 1fr 1fr; align-items: start; } }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px 20px; }
  .panel-full { grid-column: 1 / -1; margin-top: 20px; }
  label.field-label { display: block; font-size: 11px; text-transform: uppercase; color: #4a5578; margin-bottom: 8px; font-weight: 600; }
  .file-dropzone { border: 2px dashed var(--accent); border-radius: 6px; padding: 14px 10px; text-align: center; background: #f0f4ff; cursor: pointer; margin-bottom: 10px; }
  .file-dropzone:hover { background: var(--accent-soft); }
  .file-dropzone p { margin: 0; font-size: 11px; font-weight: 600; }
  .file-dropzone small { display: block; margin-top: 4px; font-size: 10px; color: #4a5578; }
  .file-dropzone input[type=file] { display: none; }
  .scanner-container { display: none; margin-bottom: 12px; border: 2px solid var(--accent); border-radius: 8px; overflow: hidden; background: #000; }
  .scanner-preview-wrapper { width: 100%; min-height: 200px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; background: #111; padding: 8px; }
  .scanner-preview-wrapper img { max-width: 48%; max-height: 240px; object-fit: contain; border-radius: 4px; }
  .doc-info { background: #f0f4ff; border-radius: 6px; padding: 10px 12px; font-size: 12px; color: #4a5578; margin-bottom: 10px; display: none; }
  .doc-info strong { color: var(--accent); }
  textarea, input[type=text] { width: 100%; font-family: var(--mono); font-size: 13px; border: 1px solid var(--line); border-radius: 6px; background: #fbfbfe; color: var(--ink); padding: 10px; }
  textarea { min-height: 180px; resize: vertical; line-height: 1.6; }
  .row { margin-bottom: 14px; }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .list-actions { margin-top: 8px; margin-bottom: 14px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .list-actions-title { font-size: 11px; color: #4a5578; width: 100%; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
  button { font-family: var(--mono); font-size: 11px; text-transform: uppercase; padding: 10px 16px; border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; font-weight: 600; }
  button.secondary { background: #fff; color: var(--ink); }
  button.utility { font-size: 10px; padding: 6px 12px; background: #fff; color: var(--accent); border-color: var(--accent); }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.3; cursor: not-allowed; background: var(--line); border-color: var(--line); color: #7a859e; }
  .status { font-size: 12px; margin-top: 10px; min-height: 16px; font-weight: 500; }
  .status.ok { color: var(--ok); }
  .status.warn { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; background: var(--accent-soft); color: var(--accent); padding: 10px; border-bottom: 2px solid var(--accent); font-weight: 700; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); }
  td[contenteditable="true"]:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-soft); }
  .review-row td { background: #fff4e6; }
  .count-pill { font-size: 11px; color: #4a5578; margin-bottom: 10px; font-weight: 600; }
  .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .empty-hint { font-size: 12px; color: #7a859e; padding: 24px 4px; }
  footer { max-width: 1100px; margin: 32px auto 0; font-size: 11px; color: #7a859e; border-top: 1px solid var(--line); padding-top: 14px; }
  .table-scroll { overflow-x: auto; border-radius: 6px; }
  #logBox { display: none; margin-top: 8px; font-size: 11px; color: #4a5578; background: #f0f4ff; padding: 8px; border-radius: 6px; max-height: 300px; overflow-y: auto; }
  .thumb-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .thumb-item { position: relative; width: 60px; height: 60px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
  .thumb-item button { position: absolute; top: 0; right: 0; padding: 0; width: 18px; height: 18px; font-size: 10px; line-height: 1; background: rgba(0,0,0,0.7); border-radius: 0 0 0 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Generador de listas de estudiantes</h1>
    <span class="tag">IA + OCR</span>
  </header>

  <div class="grid">
    <div class="panel">
      <div class="row">
        <label class="field-label">1. EXTRAER DESDE IMAGEN, PDF, EXCEL O CSV</label>
        <div class="file-dropzone" onclick="document.getElementById('fileInput').click()">
          <p>📷 Sube imagen(es), PDF, Excel o CSV</p>
          <small>Para imágenes: puedes seleccionar varias si la lista tiene más de 1 página</small>
          <input type="file" id="fileInput" accept="image/*, application/pdf, .csv, .xlsx, .xls" multiple>
        </div>

        <div id="thumbList" class="thumb-list"></div>
        <div id="docInfo" class="doc-info"></div>

        <div id="scannerBox" class="scanner-container">
          <div id="scannerPreview" class="scanner-preview-wrapper"></div>
        </div>

        <button id="btnProcessImages" class="secondary" style="width: 100%; margin-top: 4px;" disabled>
          PROCESAR IMÁGENES CON IA
        </button>
        <button id="btnTransferOcr" class="secondary" style="width: 100%; margin-top: 4px;" disabled>PASAR DATOS A LA TABLA</button>
        <button id="btnExtractNomina" class="secondary" style="width: 100%; margin-top: 8px;" disabled>EXTRAER NIE + NOMBRE</button>
        <div id="logBox"></div>
      </div>
      <div class="row">
        <label class="field-label" for="raw">2. PEGA DATOS DE EXCEL O TEXTO</label>
        <textarea id="raw" placeholder="Pega celdas desde Excel o texto..."></textarea>
      </div>
      <div class="row">
        <label class="field-label" for="domain">DOMINIO</label>
        <input type="text" id="domain" value="@clases.edu.sv">
      </div>
      <div class="actions">
        <button id="btnParse">GENERAR TABLA</button>
        <button id="btnClear" class="secondary">LIMPIAR</button>
      </div>
      <div id="status" class="status"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div id="countPill" class="count-pill"></div>
        <div class="actions" style="margin-top:0;">
          <button id="btnCopy" class="secondary" disabled>COPIAR</button>
          <button id="btnCsv" class="secondary" disabled>CSV</button>
        </div>
      </div>
      <div class="actions list-actions">
        <div class="list-actions-title">COPIAR:</div>
        <button id="btnCopyEmails" class="utility" disabled>CORREOS</button>
        <button id="btnCopyNames" class="utility" disabled>NOMBRES</button>
        <button id="btnCopyLastNames" class="utility" disabled>APELLIDOS</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>CORREO</th><th>APELLIDO</th><th>NOMBRE</th></tr></thead>
          <tbody id="outBody"><tr><td colspan="3" class="empty-hint">La tabla aparecerá aquí.</td></tr></tbody>
        </table>
      </div>
    </div>

    <div id="nominaResults" class="panel panel-full" style="display: none;">
      <div class="panel-head">
        <div><div class="count-pill" id="nominaCountPill"></div></div>
        <div class="actions">
          <button id="btnCopyNomina" class="secondary">COPIAR</button>
          <button id="btnNominaCsv" class="secondary">CSV</button>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>NIE</th><th>NOMBRE</th></tr></thead>
          <tbody id="nominaBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <footer>Doble clic para editar celdas.</footer>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ============ URL DEL BACKEND EN RENDER ============
const API_URL = "https://pagina-con-ocr-generador-lista.onrender.com/api/scan";

let rawOcrBuffer = '';
let currentParsedStudents = [];
let currentNominaStudents = [];
let currentImageNominaRows = [];
let selectedImages = [];
const CONNECTORS = new Set(["DE", "DEL", "LA", "LAS", "LOS", "SAN", "SANTA", "VDA", "Y"]);

function log(msg) {
  const logBox = document.getElementById('logBox');
  logBox.style.display = 'block';
  logBox.innerHTML += msg + '<br>';
  logBox.scrollTop = logBox.scrollHeight;
}

function isValidNie(nie) {
  if (!/^\d{7,8}$/.test(nie)) return false;
  if (/^(\d)\1{6,7}$/.test(nie)) return false;
  return true;
}

function isValidStudentName(name) {
  if (name.length < 3) return false;
  if (/\d/.test(name)) return false;
  if (!/^[A-ZÁÉÍÓÚÜÑ\s,]+$/i.test(name)) return false;
  return true;
}

const normalizeDigits = str => str
  .replace(/O/g,'0').replace(/o/g,'0').replace(/D/g,'0').replace(/d/g,'0').replace(/Q/g,'0').replace(/q/g,'0')
  .replace(/I/g,'1').replace(/i/g,'1').replace(/L/g,'1').replace(/l/g,'1').replace(/\|/g,'1').replace(/!/g,'1')
  .replace(/Z/g,'2').replace(/z/g,'2').replace(/E/g,'3').replace(/e/g,'3').replace(/A/g,'4').replace(/a/g,'4')
  .replace(/S/g,'5').replace(/s/g,'5').replace(/G/g,'6').replace(/g/g,'6').replace(/T/g,'7').replace(/t/g,'7')
  .replace(/B/g,'8').replace(/b/g,'8');

function extractNieFromText(str) {
  const source = String(str || '');
  const tagged = source.match(/(?:NIE|N\.?\s*I\.?\s*E\.?|ID|CARNET)\s*[:#.\-]?\s*([0-9OoDdQqILil|!ZzEeAaSsGgTtBb]{7,8})/i);
  if (tagged) {
    const converted = normalizeDigits(tagged[1]);
    if (isValidNie(converted)) return { nie: converted, rawMatch: tagged[0] };
  }
  const emailMatch = source.match(/\b([0-9OoDdQqILil|!ZzEeAaSsGgTtBb]{7,8})@/);
  if (emailMatch) {
    const converted = normalizeDigits(emailMatch[1]);
    if (isValidNie(converted)) return { nie: converted, rawMatch: emailMatch[0] };
  }
  const candidates = source.match(/\b[0-9OoDdQqILil|!ZzEeAaSsGgTtBb]{7,8}\b/g) || [];
  for (const candidate of candidates) {
    const converted = normalizeDigits(candidate);
    if (isValidNie(converted)) return { nie: converted, rawMatch: candidate };
  }
  return { nie: '', rawMatch: '' };
}

function cleanName(text) {
  return String(text || '')
    .replace(/Μ/g, 'M')
    .replace(/\b(Matriculado|Matriculada|Validada|Validado|Observación|Observaciones|Estado|SÍ|SI)\b/gi, ' ')
    .replace(/\bNo\.\b/gi, ' ')
    .replace(/\b[0-9]{1,2}\s*\|/g, ' ')
    .replace(/\b[0-9OoDdQqILil|!ZzEeAaSsGgTtBb]{7,8}\b/g, ' ')
    .replace(/[\[\]{}|\\=_+~*!#$%^&`<>]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toUpperCase();
}

function extractStudentsFromText(fullText) {
  const lines = fullText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const students = [];
  const seen = new Set();
  for (const line of lines) {
    if (/Sede Educativa|Dirección|Teléfono|Servicio Educativo|Plan de Estudio|Sección|Año lectivo|MINISTERIO|GERENCIA|DEPARTAMENTO|MATRÍCULA|Director/i.test(line)) continue;
    const nieInfo = extractNieFromText(line);
    if (!nieInfo.nie || !isValidNie(nieInfo.nie)) continue;
    if (seen.has(nieInfo.nie)) continue;
    let name = line.replace(nieInfo.rawMatch, ' ');
    name = cleanName(name);
    if (!isValidStudentName(name)) continue;
    seen.add(nieInfo.nie);
    students.push({ nie: nieInfo.nie, nombre: name });
  }
  return students;
}

// ============ MANEJO DE ARCHIVOS ============

document.getElementById('fileInput').addEventListener('change', e => {
  handleFiles([...e.target.files]);
  e.target.value = '';
});

document.addEventListener('paste', e => {
  const items = [...(e.clipboardData?.items || [])].filter(x => x.type.includes('image'));
  if (items.length) handleFiles(items.map(i => i.getAsFile()));
});

async function handleFiles(files) {
  if (!files.length) return;
  const status = document.getElementById('status');

  // Clasificar: imágenes vs documentos
  const images = files.filter(f => f.type.startsWith('image/'));
  const docs = files.filter(f => !f.type.startsWith('image/'));

  // Si hay documentos (PDF/Excel/CSV), procesar el primero
  if (docs.length > 0) {
    await processDocument(docs[0]);
    // Si además hay imágenes, las agregamos también
    if (images.length > 0) {
      images.forEach(f => selectedImages.push(f));
      renderThumbs();
      actualizarBotonProcesar();
    }
    return;
  }

  // Solo imágenes: agregar a la lista de seleccionadas
  images.forEach(f => selectedImages.push(f));
  renderThumbs();
  actualizarBotonProcesar();

  if (selectedImages.length > 0) {
    status.textContent = `${selectedImages.length} imagen(es) lista(s). Presiona "PROCESAR IMÁGENES CON IA".`;
    status.className = 'status ok';
  }
}

function renderThumbs() {
  const box = document.getElementById('thumbList');
  box.innerHTML = selectedImages.map((f, i) => {
    const url = URL.createObjectURL(f);
    return `<div class="thumb-item" data-idx="${i}">
      <img src="${url}" alt="img${i+1}">
      <button title="Quitar" onclick="quitarImagen(${i})">×</button>
    </div>`;
  }).join('');
}

function quitarImagen(idx) {
  selectedImages.splice(idx, 1);
  renderThumbs();
  actualizarBotonProcesar();
  if (selectedImages.length === 0) document.getElementById('status').textContent = '';
}

function actualizarBotonProcesar() {
  document.getElementById('btnProcessImages').disabled = selectedImages.length === 0;
}

async function processDocument(file) {
  const status = document.getElementById('status');
  const docInfo = document.getElementById('docInfo');
  status.textContent = 'Procesando documento...';
  status.className = 'status';
  document.getElementById('scannerBox').style.display = 'none';

  try {
    let ext = file.name ? file.name.split('.').pop().toLowerCase() : '';
    let totalStudents = 0;
    let tipo = '';

    if (['xlsx', 'xls', 'csv'].includes(ext)) {
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
      rawOcrBuffer = rows.map(r => r.join(' ')).join('\n');
      currentNominaStudents = extractStudentsFromText(rawOcrBuffer);
      totalStudents = currentNominaStudents.length;
      tipo = ext.toUpperCase();

    } else if (ext === 'pdf') {
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      let text = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        text += textContent.items.map(item => item.str).join(' ') + '\n';
      }
      rawOcrBuffer = text;
      currentNominaStudents = extractStudentsFromText(rawOcrBuffer);
      totalStudents = currentNominaStudents.length;
      tipo = `PDF (${pdf.numPages} pág.)`;

    } else {
      // Otro tipo: no soportado
      status.textContent = `⚠️ Tipo de archivo no soportado: .${ext}`;
      status.className = 'status warn';
      return;
    }

    if (totalStudents > 0) {
      status.textContent = `✅ ${totalStudents} estudiante(s) detectados en ${tipo}. Presiona "PASAR DATOS A LA TABLA".`;
      status.className = 'status ok';
      docInfo.style.display = 'block';
      docInfo.innerHTML = `📄 <strong>${file.name}</strong> — ${totalStudents} estudiante(s)`;
      document.getElementById('btnTransferOcr').disabled = false;
      document.getElementById('btnExtractNomina').disabled = false;
    } else {
      status.textContent = `⚠️ El archivo ${tipo} se procesó pero no se detectaron estudiantes.`;
      status.className = 'status warn';
      docInfo.style.display = 'block';
      docInfo.innerHTML = `📄 <strong>${file.name}</strong> — 0 estudiantes detectados`;
    }

  } catch (err) {
    console.error('Error:', err);
    status.textContent = `❌ Error procesando ${file.name}: ${err.message || err.name}`;
    status.className = 'status warn';
  }
}

// ============ PROCESAMIENTO CON IA ============

document.getElementById('btnProcessImages').addEventListener('click', async () => {
  if (selectedImages.length === 0) return;
  const status = document.getElementById('status');
  status.textContent = `Enviando ${selectedImages.length} imagen(es) a la IA...`;
  status.className = 'status';

  const preview = document.getElementById('scannerPreview');
  preview.innerHTML = selectedImages.map(f => `<img src="${URL.createObjectURL(f)}" alt="">`).join('');
  document.getElementById('scannerBox').style.display = 'block';

  ['btnTransferOcr', 'btnExtractNomina', 'btnProcessImages'].forEach(id => document.getElementById(id).disabled = true);

  try {
    const formData = new FormData();
    selectedImages.forEach(f => formData.append('files', f));

    const response = await fetch(API_URL, { method: 'POST', body: formData });

    if (!response.ok) {
      const errText = await response.text();
      console.error('Backend error:', response.status, errText);
      if (response.status === 503) {
        status.textContent = '⏳ El modelo está saturado. Intenta de nuevo en unos segundos.';
      } else {
        status.textContent = `❌ Error del servidor (${response.status}). Revisa la consola.`;
      }
      status.className = 'status warn';
      document.getElementById('btnProcessImages').disabled = false;
      return;
    }

    const data = await response.json();

    if (data.status === 'ok' && Array.isArray(data.students) && data.students.length > 0) {
      currentImageNominaRows = data.students;
      status.textContent = `✅ ${data.total} estudiante(s) detectados con IA (${selectedImages.length} imagen/es).`;
      status.className = 'status ok';
      document.getElementById('btnTransferOcr').disabled = false;
      document.getElementById('btnExtractNomina').disabled = false;
    } else {
      status.textContent = '❌ No se detectaron datos válidos en las imágenes.';
      status.className = 'status warn';
      document.getElementById('btnProcessImages').disabled = false;
    }
  } catch (err) {
    console.error('Error detallado:', err);
    status.textContent = `❌ Error: ${err.message || err.name || 'desconocido'}`;
    status.className = 'status warn';
    document.getElementById('btnProcessImages').disabled = false;
  }
});

// ============ RESTO DEL FLUJO ============

function splitName(fullName) {
  let cleanStr = fullName.replace(/@[\w.-]+/gi, '').replace(/\s+/g, ' ').trim();
  if (cleanStr.includes(',')) {
    const parts = cleanStr.split(',');
    return { apellido: parts[0].trim().toUpperCase(), nombre: parts.slice(1).join(' ').trim().toUpperCase(), review: false };
  }
  let tokens = cleanStr.split(/\s+/).filter(t => t.length > 0);
  if (!tokens.length) return { nombre: '', apellido: '', review: true };
  if (tokens.length === 1) return { nombre: '', apellido: tokens[0].toUpperCase(), review: true };
  if (tokens.length === 2) return { apellido: tokens[0].toUpperCase(), nombre: tokens[1].toUpperCase(), review: false };
  if (tokens.length === 3) return { apellido: tokens[0].toUpperCase(), nombre: tokens.slice(1).join(' ').toUpperCase(), review: false };
  let mid = 2;
  if (CONNECTORS.has(tokens[1].toUpperCase())) mid = 3;
  return { apellido: tokens.slice(0, mid).join(' ').toUpperCase(), nombre: tokens.slice(mid).join(' ').toUpperCase(), review: false };
}

document.getElementById('btnExtractNomina').addEventListener('click', () => {
  const rows = currentImageNominaRows.length > 0 ? currentImageNominaRows : currentNominaStudents;
  currentNominaStudents = rows;
  const tbody = document.getElementById('nominaBody');
  tbody.innerHTML = rows.length
    ? rows.map(r => `<tr><td contenteditable="true">${r.nie || ''}</td><td contenteditable="true">${r.nombre || ''}</td></tr>`).join('')
    : `<tr><td colspan="2" class="empty-hint">Sin datos.</td></tr>`;
  document.getElementById('nominaCountPill').textContent = `${rows.length} estudiante(s)`;
  document.getElementById('nominaResults').style.display = 'block';
});

document.getElementById('btnTransferOcr').addEventListener('click', () => {
  const domain = document.getElementById('domain').value.trim() || '@clases.edu.sv';
  const sourceRows = currentImageNominaRows.length > 0 ? currentImageNominaRows : currentNominaStudents;
  const rows = sourceRows.map(r => {
    const parts = splitName(r.nombre);
    return { nie: r.nie, apellido: parts.apellido, nombre: parts.nombre, review: parts.review };
  });
  const uniqueRows = [];
  const seen = new Set();
  for (const row of rows) {
    if (!row.nie || seen.has(row.nie)) continue;
    seen.add(row.nie);
    uniqueRows.push(row);
  }
  currentParsedStudents = uniqueRows;
  document.getElementById('raw').value = uniqueRows.map(r => `${r.nie} ${r.apellido}, ${r.nombre}`).join('\n');
  render(uniqueRows, domain);
  document.getElementById('status').textContent = `${uniqueRows.length} estudiante(s) transferidos.`;
  document.getElementById('status').className = 'status ok';
});

function render(rows, domain) {
  const body = document.getElementById('outBody'), pill = document.getElementById('countPill');
  const btns = ['btnCopy', 'btnCsv', 'btnCopyEmails', 'btnCopyNames', 'btnCopyLastNames'].map(id => document.getElementById(id));
  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="3" class="empty-hint">La tabla aparecerá aquí.</td></tr>`;
    pill.textContent = '';
    btns.forEach(b => b.disabled = true);
    return;
  }
  pill.textContent = `${rows.length} estudiante(s)`;
  body.innerHTML = rows.map(r => `<tr class="${r.review ? 'review-row' : ''}"><td contenteditable="true">${r.nie ? `${r.nie}${domain}` : ''}</td><td contenteditable="true">${r.apellido}</td><td contenteditable="true">${r.nombre}</td></tr>`).join('');
  btns.forEach(b => b.disabled = false);
}

document.getElementById('btnParse').addEventListener('click', () => {
  const domain = document.getElementById('domain').value.trim() || '@clases.edu.sv';
  const students = extractStudentsFromText(document.getElementById('raw').value);
  const rows = students.map(s => {
    const parts = splitName(s.nombre);
    return { nie: s.nie, apellido: parts.apellido, nombre: parts.nombre, review: parts.review };
  });
  currentParsedStudents = rows;
  render(rows, domain);
});

document.getElementById('btnClear').addEventListener('click', () => {
  document.getElementById('raw').value = '';
  rawOcrBuffer = '';
  currentParsedStudents = [];
  currentNominaStudents = [];
  currentImageNominaRows = [];
  selectedImages = [];
  document.getElementById('thumbList').innerHTML = '';
  document.getElementById('scannerPreview').innerHTML = '';
  document.getElementById('scannerBox').style.display = 'none';
  document.getElementById('docInfo').style.display = 'none';
  document.getElementById('logBox').style.display = 'none';
  document.getElementById('logBox').innerHTML = '';
  document.getElementById('status').textContent = '';
  ['btnTransferOcr','btnExtractNomina','btnProcessImages'].forEach(id => document.getElementById(id).disabled = true);
  document.getElementById('nominaResults').style.display = 'none';
  render([], '');
});

const setClipboard = (text, msg) => {
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('status').textContent = msg;
    document.getElementById('status').className = 'status ok';
  }).catch(() => alert('Error al copiar.'));
};

const exportCsv = (filename, headers, rows) => {
  const csv = [headers.join(','), ...rows.map(r => r.map(c => `"${c.replace(/"/g, '""')}"`).join(','))];
  const blob = new Blob(['\ufeff' + csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.body.appendChild(document.createElement('a'));
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  document.body.removeChild(a);
};

const getTableRows = (sel) => [...document.querySelectorAll(`${sel} tr`)].map(tr =>
  [...tr.querySelectorAll('td')].map(td => td.textContent.trim())
).filter(r => r.length > 0 && r[0]);

document.getElementById('btnCopy').addEventListener('click', () => setClipboard(getTableRows('#outBody').map(r => r.join('\t')).join('\n'), 'Tabla copiada.'));
document.getElementById('btnCopyEmails').addEventListener('click', () => setClipboard(getTableRows('#outBody').map(r => r[0]).join(', '), 'Correos copiados.'));
document.getElementById('btnCopyNames').addEventListener('click', () => setClipboard(getTableRows('#outBody').map(r => r[2]).join('\n'), 'Nombres copiados.'));
document.getElementById('btnCopyLastNames').addEventListener('click', () => setClipboard(getTableRows('#outBody').map(r => r[1]).join('\n'), 'Apellidos copiados.'));
document.getElementById('btnCsv').addEventListener('click', () => exportCsv('lista_estudiantes.csv', ['Correo','Apellido','Nombre'], getTableRows('#outBody')));

document.getElementById('btnCopyNomina').addEventListener('click', () => setClipboard(getTableRows('#nominaBody').map(r => r.join('\t')).join('\n'), 'Copiado.'));
document.getElementById('btnNominaCsv').addEventListener('click', () => exportCsv('nomina.csv', ['NIE','Nombre'], getTableRows('#nominaBody')));
</script>
</body>
</html>
